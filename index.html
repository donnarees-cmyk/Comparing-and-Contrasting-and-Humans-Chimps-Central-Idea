p:10px;margin:15px 0}.zone{color:#19324c;background:#f3f6ff;border:3px dashed #637fab;border-radius:16px;min-height:166px;padding:11px}.zone[data-zone='human']{background:#dff2ff}.zone[data-zone='both']{background:#f9e6ff}.zone[data-zone='chimp']{background:#e8fadd}.zone.over{outline:4px solid #f1be34}.zone h3{color:#10365b;margin:0 0 8px;font-size:1.02rem;text-align:center}.chip{display:inline-block;background:#ffffff;color:#19324c !important;padding:9px 12px;border-radius:11px;margin:4px;font-size:.88rem;border:2px solid #b5c8e9;cursor:grab;touch-action:manipulation;box-shadow:0 2px 0 #bdcbe5}.chip.active{border-color:#b66b00;background:#fff2c8;color:#19324c}.bank{color:#19324c;background:#eaf2ff;border:2px solid #b9cae5;border-radius:15px;padding:14px;min-height:75px}.choices-compact button{margin:4px}.tiny{font-size:.84rem;color:#51647a}.challenge-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.writebox{width:100%;min-height:155px;resize:vertical;border:2px solid #a5c7e4;border-radius:13px;padding:13px;background:#fcfeff;color:#122d4e}.writebox.small{min-height:100px}label{font-weight:800;display:block;margin:14px 0 4px}.sentence{background:#f2ecff;padding:9px;border-radius:10px;color:#4a347a;font-size:.92rem}.success-score{font-size:3rem;font-weight:950;color:#24689b}.missiontiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tile{background:#edf5ff;border-radius:16px;padding:13px;border:1px solid #c6d8ef}.tile strong{display:block}.speaker{margin-left:4px;padding:7px 11px;background:#e0f6ff;color:#1f5676;box-shadow:0 3px 0 #9dccdf;font-size:.85rem}.confetti{position:fixed;pointer-events:none;inset:0;overflow:hidden;z-index:20}.confetti i{position:absolute;top:-30px;animation:fall 2.6s forwards;font-style:normal}@keyframes fall{to{transform:translateY(105vh) rotate(780deg);opacity:0}}.mascot{font-size:3rem;display:inline-block;animation:wave 2.7s ease-in-out infinite;transform-origin:bottom}@keyframes wav const A={intro:'',same:'',different:'',conclusion:''};const KEY='tll_chimp_human_comparison_v2';let data={page:0,quiz:0,points:0,results:{},attempts:{},sort:{},venn:{},draft:{...A},name:'',finished:false};try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object')data={...data,...v,draft:{...A,...v.draft}}}catch(e){}let rate=.94,selected=null,feedback='',finishedQuestion=false,choiceMode='';const $=id=>document.getElementById(id),safe=t=>String(t).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));$('saveStatus').textContent='💾 Saved on this device'}catch(e){$('saveStatus').textContent='⚠️ Storage unavailable · download report'}}function stopRead(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}function speak(t){stopRead();if(!('speechSynthesis'in window)){alert('Text-to-speech is not available on this device.');return;}let u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]*>/g,' '));u.lang='en-US';u.rate=rate;let voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>/Google US English/i.test(v.name)&&/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en[-_]US/i.test(v.lang))||null;window.speechSynthesis.speak(u)}function readPage(){speak($('app').innerText)}function listen(id){let e=$(id);if(e)speak(e.innerText||e.value||'')}function go(p){stopRead();data.page=p;persist();render();window.scrollTo(0,0)}const stages=['Welcome','Human Research','Chimpanzee Research','Goodall Field Notes','Evidence Sort','Comprehension Arena','Comparison Builder','Show Your Knowledge'];const humanText=[`Humans are primates, a group of mammals that also includes monkeys and other apes. Humans usually walk upright on two legs. Our hands can grip and move small objects precisely. These physical abilities help us write, make tools, and complete detailed tasks.`,`Human communication includes spoken language, writing, facial expressions, and gestures. People can explain complicated ideas and teach knowledge to younger generations. Children learn through observation, practice, and instruction. Across the world, human communities create traditions and work together to solve problems.`,`Humans form strong relationships with family and friends. People may comfort someone who is upset, cooperate in teams, or disagree about what to do. Humans can feel joy, fear, anger, and sadness. Although all people have needs in common, the way we live is shaped by our communities and cultures.`,`Humans have built technologies that can change environments on a large scale. A microscope makes tiny objects visible; a computer can store information. These inventions are very different from a simple stick used to reach food. Studying humans alongside other primates helps scientists understand both shared traits and important differences.`];const chimpText=[`Chimpanzees are great apes that live in parts of Africa. They usually travel on the ground using their hands and feet, a movement called knuckle-walking, but they can stand and walk on two legs for short distances. Their long arms and strong hands also help them climb.`,`Chimpanzees live in communities. They communicate using calls, gestures, facial expressions, and body movements. Young chimpanzees learn by watching older group members. They might observe how an adult finds food, then practice the skill themselves.`,`Wild chimpanzees sometimes use natural materials as tools. For example, a chimpanzee may place a grass stem into a termite mound to gather insects. In some communities, chimpanzees use stones to crack nuts. Different groups may learn different ways to use tools.`,`Chimpanzees also develop close relationships. Mothers care for infants over several years. Group members may groom one another, play, cooperate, and compete. They may show behaviors that researchers interpret as comfort, excitement, or fear. Scientists observe these actions carefully rather than assuming every chimpanzee behaves exactly like a human.`];const goodallNotes=[{title:'Research Moment 1 · The tool',body:'In 1960, Jane Goodall watched a chimpanzee named David Greybeard use a grass stem to gather termites. She later observed chimpanzees remove leaves from twigs before using them. This changed scientists’ ideas about whether only humans could make and use tools.',question:'Why did this matter?',take:'Both humans and chimpanzees can use tools, although the tools and their complexity may differ.'},{title:'Research Moment 2 · Families',body:'By watching chimpanzees over many years, Goodall studied the relationships between mothers and their infants. She learned that early experiences and close family relationships were important in chimpanzee communities, much as they are in human families.',question:'What was the comparison?',take:'Both species form relationships and young members rely on adults as they grow.'},{title:'Research Moment 3 · Patient observation',body:'Goodall began her research with simple tools such as binoculars, a notebook, and a pencil. At first, chimpanzees avoided her. By returning patiently and recording observations, she collected evidence about their everyday lives.',question:'What makes this reliable research?',take:'Careful observations made repeatedly are stronger evidence than a quick guess.'}];const SORT=[['Often walks upright for long distances','human'],['Uses detailed written language','human'],['Makes complex electronic technology','human'],['May knuckle-walk on the ground','chimp'],['Can gather termites with a grass stem','chimp'],['Grooms other group members by cleaning fur','chimp'],['Forms family bonds','both'],['Can learn by watching others','both'],['Uses tools to solve problems','both'],['Communicates through gestures','both']];const VENN=[['Uses a spoken and written language system','human'],['Often uses computers and microscopes','human'],['Usually walks upright on two feet','human'],['May gather termites with a grass stem','chimp'],['Usually knuckle-walks on the ground','chimp'],['Lives in wild communities in parts of Africa','chimp'],['Uses tools','both'],['Learns by observing others','both'],['Forms social relationships','both'],['Communicates with facial expressions','both'],['Young members rely on caregivers','both'],['Can work with others','both']];const Q=[{q:'Which statement BEST expresses a central idea shared by the human and chimpanzee readings?',options:['Only humans learn from others.','Humans and chimpanzees share social and learning behaviors but also have differences.','Chimpanzees use computers to communicate.','Every primate moves in the same way.'],a:1,h:'Look for a statement that includes both shared traits AND differences.',why:'Both texts describe communication, learning, relationships, and different kinds of movement and technology.'},{q:'Which detail from the chimpanzee passage BEST supports the claim that chimps learn through observation?',options:['Chimpanzees live in parts of Africa.','Chimpanzees sometimes climb trees.','Young chimpanzees watch adults find food and practice the skill.','Chimpanzees have long arms.'],a:2,h:'Choose the evidence that shows one chimp watching another and learning.',why:'Watching and practicing is direct evidence of learning by observing.'},{q:'Which behavior appears in BOTH texts?',options:['Using written language','Making electronic devices','Learning from older group members','Knuckle-walking for travel'],a:2,h:'Look for a learning behavior described in the human and chimpanzee readings.',why:'Both humans and chimpanzees can learn by watching older members.'},{q:'What is a major DIFFERENCE between human and chimpanzee communication?',options:['Only chimps use gestures.','Humans use complex spoken and written language.','Only humans show facial expressions.','Chimpanzees never communicate.'],a:1,h:'Look at the kinds of communication described in the first two paragraphs of each passage.',why:'Humans have complex spoken and written language systems; chimpanzees rely on calls, gestures, and expressions.'},{q:'How did Jane Goodall’s research change scientists’ thinking?',options:['It showed chimpanzees sometimes make and use tools.','It proved all chimpanzees speak human languages.','It showed chimpanzees never cooperate.','It proved humans and chimpanzees are the same species.'],a:0,h:'Think about David Greybeard and the termite mound.',why:'Goodall observed tool use and tool modification, challenging an earlier assumption.'},{q:'Which pair of evidence would BEST support a comparison paragraph about family relationships?',options:['Humans build microscopes; chimpanzees knuckle-walk.','Humans comfort family members; chimpanzee mothers care for infants over years.','Humans often walk upright; chimps climb.','Humans write; chimpanzees use grass stems.'],a:1,h:'Both details should connect to the SAME category: relationships.',why:'Both details provide evidence about social and family bonds.'},{q:'Which transition BEST introduces a DIFFERENCE? “Both species can use tools. _____, human technology can be much more complex.”',options:['Similarly','For instance','However','Also'],a:2,h:'The next sentence contrasts two ideas.',why:'However signals a difference.'},{q:'Which statement is a careful comparison supported by the readings?',options:['Chimpanzees are exactly like humans.','Humans are smarter in every situation.','Both species can learn from others, but they communicate in different ways.','Chimpanzees never make tools.'],a:2,h:'Avoid absolute words such as always, never, exactly, or every.',why:'This claim is precise, balanced, and supported by both passages.'},{q:'Which sentence BEST explains why the tool-use example is important?',options:['It is an entertaining story about an animal.','It provides evidence that some chimps solve problems by using objects.','It shows that only humans can invent things.','It tells where all chimps live.'],a:1,h:'Choose an explanation of what the evidence demonstrates.',why:'Tool use is evidence of problem-solving behavior.'},{q:'Which organization is strongest for a compare-and-contrast response?',options:['Unrelated facts → ending → opinion','Introduction → shared characteristics → differences → conclusion','Conclusion → unrelated example → introduction','List every detail without grouping'],a:1,h:'Put your main idea first, then organize similarities and differences.',why:'This creates a logical structure with clear categories.'}];
function card(body,cls=''){return `<section class="card ${cls}">${body}</section>`}function next(label='Continue →'){return `<div class="endnav"><button class="light" onclick="go(${Math.max(0,data.page-1)})">← Back</button><button class="green" onclick="go(${data.page+1})">${label}</button></div>`}function render(){let p=data.page;$('mission').textContent=`Mission ${p+1} of 8 · ${stages[p]}`;$('progress').style.width=Math.round((p/7)*100)+'%';$('score').textContent=`⭐ ${data.points} XP`;let out='';if(p===0)out=card(`<img class="hero-logo" src="literacy-locksmith-logo.png" alt="The Literacy Locksmith colorful key and book logo"><div class="eyebrow">🔓 Unlock the Primate Mystery</div><h1>🐒 Humans & Chimpanzees:<br>Primate Connections</h1><p>Discover the surprising ways two primates are alike—and what makes them different. Read two science articles, investigate Jane Goodall’s findings, sort clues, and create your own evidence-based comparison.</p><span class="pill">Interactive investigations · 2 readings · creative comparison</span>`,'hero')+card(`<h2>🌿 Welcome, field researcher! <span class="mascot">🐵</span></h2><label for="student">Your name</label><input style="padding:13px;border:2px solid #b4cfea;border-radius:12px;width:min(100%,390px)" id="student" placeholder="First name or teacher-assigned ID" value="${safe(data.name)}" oninput="data.name=this.value;persist()"><div class="callout"><b>Essential question:</b> How are humans and chimpanzees alike, and how are they different? What did Jane Goodall’s research help us understand?</div><div class="missiontiles"><div class="tile">📖 <strong>Read & investigate</strong>Learn about two primates</div><div class="tile">🔎 <strong>Examine evidence</strong>Study Goodall’s notes</div><div class="tile">🎯 <strong>Play & sort</strong>Drag or tap clues</div><div class="tile">✍️ <strong>Show what you know</strong>Create your comparison</div></div><div class="callout warn">💾 This game automatically saves your progress in this browser on this device. Return using the same browser and address. Do not clear site data. Download your final report for backup.</div><p><b>Florida B.E.S.T. ELA.6.R.2.2:</b> Analyze the central idea(s), implied or explicit, and its development throughout a text.</p><p><b>Writing connection ELA.6.C.1.4:</b> Write expository texts to explain and/or analyze information from multiple sources, using a logical organizational structure, relevant elaboration, and varied transitions.</p><button class="gold" onclick="go(1)">🚀 Start Research Expedition</button>`);
if(p===1||p===2){let human=p===1,parts=human?humanText:chimpText;out=card(`<span class="pill">Research Station ${human?'A':'B'}</span><h2>${human?'👩‍🔬 Humans: Learning, Communicating, Connecting':'🐵 Chimpanzees: Life in a Community'}</h2><p>Read all four paragraphs. Use the 🔊 controls to listen as often as needed. Then write down one fact that surprised you.</p><div class="passage">${parts.map((t,i)=>`<div id="para${i}"><span class="source-label">Paragraph ${i+1}</span><p>${t}</p><button class="speaker" onclick="listen('para${i}')">🔊 Listen to paragraph ${i+1}</button></div>`).join('')}</div><div class="callout"><b>Vocabulary keys:</b> ${human?'<span class="vocab">primate — a mammal group including humans and apes</span><span class="vocab">precisely — accurately and carefully</span><span class="vocab">tradition — a custom passed down</span>':'<span class="vocab">community — a group living and interacting together</span><span class="vocab">knuckle-walking — moving on hands and feet</span><span class="vocab">grooming — cleaning another animal’s fur</span>'}</div><label>Research note: What is one important fact?</label><textarea class="writebox small" id="note" placeholder="I learned that ..." oninput="setNote('${human?'human':'chimp'}',this.value)">${safe(data[human?'noteHuman':'noteChimp']||'')}</textarea>${next(human?'🐒 Study Chimpanzees →':'🔭 Study Jane Goodall →')}`)}
if(p===3)out=card(`<span class="pill">Primary Research Spotlight</span><h2>🔭 Jane Goodall’s Discovery Journal</h2><p>Read these <b>adapted research summaries</b> based on Jane Goodall’s documented observations at Gombe. These are <b>not word-for-word excerpts</b> from her books. Read, listen, and consider how each finding relates to humans.</p>${goodallNotes.map((n,i)=>`<div class="passage" id="note${i}" style="margin-bottom:15px"><h3>${n.title}</h3><p>${n.body}</p><button class="speaker" onclick="listen('note${i}')">🔊 Listen to the research note</button><p><b>${n.question}</b> ${n.take}</p></div>`).join('')}<div class="callout warn">📓 A scientist makes a <b>claim</b> only after collecting <b>evidence</b>. Notice how these observations challenge earlier assumptions about chimpanzees.</div><p class="tiny">Background adapted from Jane Goodall Institute: <a href="https://janegoodall.org/news/55-years-at-gombe-qa-with-jane-on-origins-of-life-work/" target="_blank" rel="noopener">55 Years at Gombe (2015)</a> and published interview material. Source content is paraphrased for educational use.</p>${next('🧩 Sort Your Evidence →')}`);
if(p===4||p===6){let isV=p===6,arr=isV?VENN:SORT,store=isV?data.venn:data.sort,title=isV?'🔍 Build Your Comparison Board':'🧩 Evidence Sorting Expedition';out=card(`<span class="pill">${isV?'Graphic Organizer':'Drag & Drop Mission'}</span><h2>${title}</h2><p><b>Directions:</b> Drag each clue to the correct category. On an iPad, you can also <b>tap a clue, then tap its destination</b>. Finish every clue before checking.</p><div class="callout">Human only = a trait emphasized for humans. Both = a characteristic described in both readings. Chimp only = a trait emphasized for chimpanzees.</div><div class="bank" id="bank">${arr.map((a,i)=>store[i]===undefined?chip(i,a[0]):'').join('')}</div><div class="board">${[['human','👩 Humans only'],['both','🤝 Both species'],['chimp','🐵 Chimpanzees only']].map(([z,t])=>`<div class="zone" data-zone="${z}" onclick="place('${z}')" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="drop(event,'${z}')"><h3>${t}</h3><div>${arr.map((a,i)=>store[i]===z?chip(i,a[0]):'').join('')}</div></div>`).join('')}</div><div class="row"><button class="light" onclick="undoSort()">↶ Return last clue</button><button class="gold" onclick="checkSort()">✅ Check my sorting</button></div><div id="sortfb" class="feedback" aria-live="polite">${safe(data[isV?'vennFb':'sortFb']||'Your board saves after every move.')}</div>${next(isV?'✍️ Write Your Comparison →':'🎮 Comprehension Arena →')}`)}
if(p===5){let q=Q[data.quiz],res=data.results[data.quiz],attempt=data.attempts[data.quiz]||0,done=res!==undefined;out=card(`<div class="challenge-top"><span class="pill">Question ${data.quiz+1} of ${Q.length}</span><span>⭐ ${data.points} XP</span></div><h2>🎮 Comprehension Arena</h2><p class="tiny">FAST-style original practice · not an official released test</p><div class="callout" id="question"><b>${q.q}</b></div><button class="speaker" onclick="listen('question')">🔊 Read the question</button><div class="choices">${q.options.map((o,i)=>`<button class="choice ${done?(i===q.a?'correct':res.picked===i?'wrong':''):selected===i?'sel':''}" ${done?'disabled':''} onclick="pick(${i})">${'ABCD'[i]}. ${o}</button>`).join('')}</div><div class="row"><button class="green" ${done?'disabled':''} onclick="answer()">✅ Check answer</button><button class="light" onclick="go(1)">📖 Reread texts</button></div><div class="feedback ${done?'good':''}" id="qfb">${done?(res.correct?'✅ Correct! ':'💡 Learning moment: ')+q.why:feedback||(attempt===1?'You have one more try.':'Choose an answer.')}</div><div class="endnav"><button class="light" ${data.quiz===0?'disabled':''} onclick="stepQ(-1)">← Previous</button><button class="gold" onclick="stepQ(1)">${data.quiz===Q.length-1?'🔍 Build Comparison Board':'Next question →'}</button></div>`)}
if(p===7){let d=data.draft;out=card(`<span class="pill">Final Field Report</span><h2>✍️ Show Your Knowledge</h2><p>Use evidence from <b>both reading passages</b> and at least <b>one Jane Goodall research note</b> to explain how humans and chimpanzees are alike and different. Organize your response into paragraphs and explain why the evidence matters.</p><div class="callout"><b>Your writing prompt:</b> Compare and contrast human and chimpanzee characteristics, including communication, tool use, learning, or relationships. Explain how Jane Goodall’s observations improved scientists’ understanding of chimpanzees.</div><details><summary><b>📖 Open reading passages to review evidence</b></summary><div class="sources"><div class="passage"><h3>Human reading</h3>${humanText.map(t=>`<p>${t}</p>`).join('')}</div><div class="passage"><h3>Chimpanzee reading</h3>${chimpText.map(t=>`<p>${t}</p>`).join('')}</div></div>${goodallNotes.map(n=>`<p><b>${n.title}:</b> ${n.body}</p>`).join('')}</details>${[['intro','1 · Introduce your comparison','Humans and chimpanzees are both primates, but ...'],['same','2 · Explain two similarities with evidence','According to the human and chimpanzee texts, both ... This is important because ...'],['different','3 · Explain two differences with evidence','However, one important difference is ... For example, ...'],['conclusion','4 · Explain Goodall’s discovery and conclude','Jane Goodall’s observations showed ... Overall, ...']].map(([k,title,starter])=>`<label for="${k}">${title}</label><div class="sentence">✍️ Sentence starter: ${starter}</div><textarea class="writebox" id="${k}" oninput="saveDraft('${k}',this.value)" placeholder="Write your own ideas here..."></textarea><div class="row"><button class="speaker" onclick="speak(data.draft['${k}']||'Nothing written yet')">🔊 Listen to my paragraph</button></div>`).join('')}<h3>✅ Check your writing</h3><div class="callout"><label><input type="checkbox"> I described similarities and differences.</label><label><input type="checkbox"> I used facts from both readings.</label><label><input type="checkbox"> I explained at least one Goodall observation.</label><label><input type="checkbox"> I included transitions and a conclusion.</label></div><div class="row"><button class="light" onclick="speak(Object.values(data.draft).join('. '))">🔊 Listen to my entire report</button><button class="light" onclick="downloadReport()">⬇ Save my work</button><button class="green" onclick="complete()">🏆 Finish and view report</button></div><div class="feedback" id="writefb">Your paragraphs save automatically on this device. Complete your report and download a copy for Canvas or Schoology.</div>`);}
if(data.finished&&p===7)out+=card(`<h2>🏆 Research Expedition Complete!</h2><div class="success-score">⭐ ${data.points} XP</div><p>${safe(data.name||'Researcher')}, you investigated primates using two reading passages and Jane Goodall research evidence.</p><p>Comprehension questions completed: <b>${Object.keys(data.results).length} / ${Q.length}</b></p><p><b>Teacher review needed:</b> Written comparisons are not automatically graded for accuracy or quality.</p><button class="gold" onclick="downloadReport()">⬇ Download my full report</button><button class="light" onclick="window.print()">🖨 Print</button>`);
$('app').innerHTML=out;if(p===7)for(let k of Object.keys(A)){let e=$(k);if(e)e.value=data.draft[k]||''}if(p===4||p===6)setupDrag();}
function setNote(kind,v){data[kind==='human'?'noteHuman':'noteChimp']=v;persist()}function saveDraft(k,v){data.draft[k]=v;persist()}function pick(i){selected=i;feedback='';render()}function answer(){if(selected===null){$('qfb').textContent='Choose an answer first.';return}let idx=data.quiz,q=Q[idx];if(data.results[idx]!==undefined)return;let tries=(data.attempts[idx]||0)+1;data.attempts[idx]=tries;if(selected===q.a){data.results[idx]={correct:true,picked:selected,tries};data.points+=tries===1?10:5;feedback='';speak('Correct! '+q.why)}else if(tries>=2){data.results[idx]={correct:false,picked:selected,tries};feedback='';speak('The correct answer is '+q.options[q.a]+'. '+q.why)}else{selected=null;feedback='Not quite. '+q.h+' You have one more chance.';speak(feedback)}persist();render();if(feedback){$('qfb').textContent=feedback;$('qfb').className='feedback retry'}}function stepQ(d){if(d===1&&data.quiz===Q.length-1){go(6);return}data.quiz=Math.max(0,Math.min(Q.length-1,data.quiz+d));selected=null;feedback='';persist();render();window.scrollTo(0,0)}function chip(i,t){return `<button class="chip" type="button" data-id="${i}" draggable="true" onclick="chooseChip(${i},event)" ondragstart="drag(event,${i})">${safe(t)}</button>`}let activeChip=null;function chooseChip(id,e){e.stopPropagation();activeChip=id;document.querySelectorAll('.chip').forEach(el=>el.classList.toggle('active',Number(el.dataset.id)===id))}function setupDrag(){document.querySelectorAll('.zone').forEach(el=>el.classList.remove('over'))}function drag(e,id){activeChip=id;e.dataTransfer.setData('text/plain',String(id));e.dataTransfer.effectAllowed='move'}function drop(e,z){e.preventDefault();let s=e.dataTransfer.getData('text/plain');if(s!=='')activeChip=Number(s);place(z)}function place(z){if(activeChip===null)return;let obj=data.page===6?data.venn:data.sort;obj[activeChip]=z;activeChip=null;persist();render()}function undoSort(){let obj=data.page===6?data.venn:data.sort,keys=Object.keys(obj);if(keys.length){delete obj[keys[keys.length-1]];persist();render()}}function checkSort(){let isV=data.page===6,arr=isV?VENN:SORT,obj=isV?data.venn:data.sort;let total=arr.length,filled=Object.keys(obj).length;if(filled<total){$('sortfb').textContent=`You placed ${filled} of ${total} clues. Finish the board first.`;return}let correct=arr.filter((x,i)=>obj[i]===x[1]).length;let key=isV?'vennChecked':'sortChecked';if(!data[key]){data.points+=Math.round(correct/total*20);data[key]=true}let message=`You sorted ${correct} of ${total} clues correctly. `+(correct<total?'Look closely at the reading and move the clues you want to reconsider.':'Amazing! Your evidence board is complete.');data[isV?'vennFb':'sortFb']=message;persist();$('sortfb').textContent=message;speak(message);if(correct===total)celebrate()};function celebrate(){let e=$('confetti');e.innerHTML='';for(let i=0;i<50;i++){let el=document.createElement('i');el.textContent=['⭐','🍃','💛','🎉'][i%4];el.style.left=Math.random()*100+'%';el.style.animationDelay=Math.random()*.9+'s';el.style.fontSize=(16+Math.random()*22)+'px';e.appendChild(el)}setTimeout(()=>e.innerHTML='',3300)}function complete(){let total=Object.values(data.draft).join(' ').trim().split(/\s+/).filter(Boolean).length;if(total<100){$('writefb').textContent=`Your response has about ${total} words. Build a fuller explanation with evidence from both texts and Jane Goodall research (at least 100 words for this practice).`;return}data.finished=true;persist();render();celebrate();window.scrollTo(0,document.body.scrollHeight)}function downloadReport(){let lines=['THE LITERACY LOCKSMITH — PRIMATE CONNECTIONS','Student: '+(data.name||'Researcher'),'Date: '+new Date().toLocaleDateString(),'Standards: ELA.6.R.2.2; ELA.6.C.1.4; comparison extension ELA.6.R.3.3','Game XP: '+data.points,'Questions completed: '+Object.keys(data.results).length+'/'+Q.length,'','HUMAN RESEARCH NOTE',data.noteHuman||'','CHIMPANZEE RESEARCH NOTE',data.noteChimp||'','COMPARISON RESPONSE',...Object.values(data.draft),'','Teacher review required for written response.'];let blob=new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='primate-connections-'+(data.name||'student').replace(/[^a-z0-9_-]/gi,'_')+'.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}window.addEventListener('beforeunload',persist);if('speechSynthesis'in window)window.speechSynthesis.onvoiceschanged=()=>{};render();
</script></body></html>
